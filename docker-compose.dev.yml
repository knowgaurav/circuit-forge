services:
  # MongoDB for local development
  mongodb:
    image: mongo:7
    container_name: circuitforge-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=circuitforge
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # FastAPI Backend with hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: circuitforge-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      # Mount host gcloud ADC so the container authenticates as you (read-only).
      - ~/.config/gcloud/application_default_credentials.json:/tmp/gcp/application_default_credentials.json:ro
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=circuitforge
      - CORS_ORIGINS=["http://localhost:3000"]
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # Google Vertex AI auth via ADC mounted from the host.
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      # Force watchfiles to poll so uvicorn --reload detects edits across the bind mount
      - WATCHFILES_FORCE_POLLING=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://ai.megallm.io/v1/chat/completions}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-4000}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}
    depends_on:
      mongodb:
        condition: service_healthy

  # Next.js Frontend with hot reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: circuitforge-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/ws
      # Force webpack to poll so next dev fast refresh detects edits across the bind mount
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  mongodb_data:
